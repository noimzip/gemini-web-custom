<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codex Pets</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../shared/pet.js" defer></script>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <h1>Codex Pets</h1>
    <section id="pet" class="pet" hidden aria-label="Preview">
      <div class="preview"><canvas id="preview" aria-hidden="true"></canvas></div>
      <div class="pet-controls">
        <strong id="name"></strong>
        <label class="toggle"><input type="checkbox" id="visible"> <span data-label="visible">Show in Gemini</span></label>
      </div>
    </section>
    <p id="hint" data-label="hint">Choose a Codex Pets sprite sheet in PNG or WebP format.</p>
    <div class="actions">
      <button type="button" id="choose" data-label="choose" disabled>Choose file</button>
      <input type="file" id="file" accept=".png,.webp,image/png,image/webp" hidden>
      <button type="button" id="remove" data-label="remove" hidden>Remove</button>
    </div>
    <p id="status" role="status"></p>
  </body>
</html>
